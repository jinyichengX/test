<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>惯性滚动 — 三步公式</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui; background:#0d1117; color:#c9d1d9; }
  .wrap { display:flex; gap:20px; padding:20px; height:100vh; align-items:center; justify-content:center; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:8px; display:flex; flex-direction:column; overflow:hidden; }
  .panel h3 { padding:10px 14px; font-size:13px; background:#21262d; display:flex; justify-content:space-between; }
  .cw { overflow:hidden; background:#0a0c10; touch-action:none; position:relative; }
  canvas { display:block; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .ctls { padding:8px 14px; display:flex; gap:14px; align-items:center; font-size:12px; border-top:1px solid #30363d; }
  .ctls label { display:flex; align-items:center; gap:5px; }
  .ctls input[type=range] { width:80px; accent-color:#58a6ff; }
  .stats { padding:6px 14px; font-size:11px; color:#8b949e; border-top:1px solid #21262d; display:flex; gap:18px; font-family:monospace; }
  .stats span { color:#58a6ff; }

  .code-panel { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:14px; width:260px; }
  .code-panel h3 { font-size:12px; margin:0 0 10px; }
  .code-panel pre { font-size:11px; line-height:1.6; color:#7ee787; font-family:monospace; }
  .code-panel pre .hl { color:#f0883e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>拖拽列表松手 → 惯性滚动 <span style="font-weight:400;color:#8b949e;">k=摩擦系数</span></h3>
    <div class="cw" id="wrap"><canvas id="c"></canvas></div>
    <div class="ctls">
      <label>k <input type="range" id="fric" min="0.80" max="0.98" step="0.01" value="0.94"></label>
      <span id="fricVal" style="font-family:monospace;color:#58a6ff;">0.94</span>
    </div>
    <div class="stats">v: <span id="vel">0</span> px/tick | offset: <span id="off">0</span> | 状态: <span id="st">▇</span></div>
  </div>

  <div class="code-panel">
    <h3>三步公式</h3>
    <pre>// 1. 追踪速度
<span class="hl">v</span> = <span class="hl">offset</span> - <span class="hl">last</span>

// 2. 衰减
<span class="hl">v</span> *= <span class="hl" id="kDisp">0.94</span>

// 3. 叠加到位移
<span class="hl">offset</span> += <span class="hl">v</span>

|v| &lt; 1 → 停止</pre>
  </div>
</div>

<script>
const W = 400, H = 360, ITEM_H = 42, PAD = 4, COUNT = 30;
const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = W; c.height = H;
document.getElementById('wrap').style.width = W+'px';
document.getElementById('wrap').style.height = H+'px';

const MAX = 0, MIN = H - (COUNT * ITEM_H + PAD * 2);

let offset = 0, velocity = 0, lastOffset = 0;
let dragging = false, lastY = 0, panStart = 0;
let k = 0.94;

// ===== 三步公式 =====
function step1_inertia_start() {
  velocity = offset - lastOffset;           // 1. 松手瞬间取末帧速度
}
function step2_step3_tick() {
  if (Math.abs(velocity) < 1) { velocity = 0; return; }
  velocity *= k;                             // 2. 摩擦衰减
  offset   += velocity;                      // 3. 叠加到位移
}
// ===================

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

  const y0 = Math.round(offset) + PAD;
  for (let i = 0; i < COUNT; i++) {
    const y = y0 + i * ITEM_H;
    if (y + ITEM_H < -2 || y > H + 2) continue;
    ctx.fillStyle = `hsl(${(i*9)%360},24%,${16+(i%3)*3}%)`;
    ctx.fillRect(PAD, y, W - PAD*2, ITEM_H - 1);
    ctx.fillStyle = '#8b949e'; ctx.font = '12px system-ui';
    ctx.fillText(`Item ${i}`, PAD + 10, y + 28);
  }
  ctx.restore();

  // scrollbar
  const totalH = COUNT * ITEM_H;
  if (totalH > H) {
    const th = Math.max(20, H * H / totalH);
    const ty = -offset / (totalH - H) * (H - th);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(W - 5, ty, 4, th);
  }
}

// ===== Input =====
c.addEventListener('pointerdown', e => {
  dragging = true;
  velocity = 0;
  lastY = e.clientY;
  panStart = lastOffset = offset;
  c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointermove', e => {
  if (!dragging) return;
  lastOffset = offset;
  offset = panStart + (e.clientY - lastY);
  if (offset > MAX) offset = MAX + (offset - MAX) / 4;
  if (offset < MIN) offset = MIN + (offset - MIN) / 4;
});
c.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  step1_inertia_start();  // === 第 1 步 ===
  c.releasePointerCapture(e.pointerId);
});

// ===== Tick =====
function tick() {
  requestAnimationFrame(tick);
  if (!dragging) {
    step2_step3_tick();   // === 第 2、3 步 ===
    // overscroll snap
    if (offset > MAX) { offset += (MAX - offset) * 0.2; if (Math.abs(offset - MAX) < 0.3) offset = MAX; }
    if (offset < MIN) { offset += (MIN - offset) * 0.2; if (Math.abs(offset - MIN) < 0.3) offset = MIN; }
  }
  draw();
  document.getElementById('vel').textContent = velocity.toFixed(1);
  document.getElementById('off').textContent = Math.round(offset);
  document.getElementById('st').textContent = dragging ? '抓取' : Math.abs(velocity) >= 1 ? '▶ 惯性' : '▇';
}
requestAnimationFrame(tick);

// slider
const fricEl = document.getElementById('fric');
fricEl.addEventListener('input', () => {
  k = parseFloat(fricEl.value);
  document.getElementById('fricVal').textContent = k.toFixed(2);
  document.getElementById('kDisp').textContent = k.toFixed(2);
});
</script>
</body>
</html>
