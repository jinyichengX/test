<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPGUI 多边形绘制可视化工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1a2e;--panel-bg:#16213e;--card-bg:#0f3460;--accent:#e94560;--accent-hover:#ff6b81;--text:#e0e0e0;--text-dim:#999;--border:#2a2a4a;--slider-track:#333;--success:#4caf50;--warning:#ff9800;--radius:8px}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;height:100vh;max-width:1600px;margin:0 auto}

.preview-area{flex:1;display:flex;align-items:center;justify-content:center;background:#e8ecf1;position:relative;min-width:0;overflow:hidden}
.preview-area canvas{display:block;border:1px solid #ccc;box-shadow:0 2px 12px rgba(0,0,0,.15);cursor:crosshair}
.control-panel{width:400px;background:var(--panel-bg);display:flex;flex-direction:column;border-left:1px solid var(--border);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--slider-track) transparent}
.control-panel::-webkit-scrollbar{width:6px}
.control-panel::-webkit-scrollbar-thumb{background:var(--slider-track);border-radius:3px}
.panel-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel-bg);z-index:2}
.panel-header h1{font-size:18px;font-weight:600;color:var(--accent)}
.panel-header .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.panel-body{padding:10px 24px;display:flex;flex-direction:column;gap:8px}

.cg{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.cg .title{font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.slider-row:last-child{margin-bottom:0}
.slider-row label{font-size:12px;color:var(--text);white-space:nowrap;min-width:68px}
.slider-row .range-wrap{flex:1;display:flex;align-items:center;gap:4px}
.slider-row .val{font-size:11px;color:var(--accent);font-weight:600;min-width:26px;text-align:right}
.slider-row .unit{font-size:10px;color:var(--text-dim);min-width:12px}
.slider-row .stepper{display:flex;gap:1px;margin-left:2px}
.slider-row .stepper button{width:18px;height:18px;padding:0;border:1px solid var(--border);border-radius:3px;background:rgba(255,255,255,.04);color:var(--text);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:monospace;user-select:none}
.slider-row .stepper button:hover{background:var(--card-bg);border-color:var(--accent);color:var(--accent)}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;background:var(--slider-track);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 8px rgba(233,69,96,.4)}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.color-row label{font-size:12px;min-width:68px}
.color-row input[type=color]{width:32px;height:24px;border:2px solid var(--border);border-radius:4px;cursor:pointer;background:transparent}
.color-row .hex-val{font-size:12px;color:var(--text);font-family:monospace}

.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.toggle-row label{font-size:12px;flex:1}
.toggle-switch{position:relative;width:44px;height:24px;background:var(--slider-track);border-radius:12px;cursor:pointer;transition:background .2s}
.toggle-switch.active{background:var(--accent)}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s}
.toggle-switch.active::after{left:22px}
.toggle-label{font-size:11px;color:var(--text-dim);min-width:50px;text-align:center}

.btn-row{display:flex;gap:6px}
.btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-pri:hover{background:var(--accent-hover)}
.btn-sec{background:transparent;color:var(--text)}
.btn-sec:hover{background:rgba(255,255,255,.05)}
.btn-dan{background:transparent;color:var(--warning);border-color:var(--warning)}
.btn-dan:hover{background:rgba(255,152,0,.1)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:8px 20px;border-radius:5px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}

.vertex-list{max-height:120px;overflow-y:auto;font-family:monospace;font-size:11px;color:var(--text-dim)}
.vertex-list .v-item{padding:2px 6px;cursor:pointer;border-radius:3px}
.vertex-list .v-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.vertex-list .v-item.selected{background:var(--card-bg);color:var(--accent)}

.help-text{font-size:11px;color:var(--text-dim);line-height:1.6}
.help-text kbd{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px;font-size:10px;color:var(--text)}

@media(max-width:860px){.app{flex-direction:column}.preview-area{height:50vh}.control-panel{width:100%;flex:1}}
</style>
</head>
<body>
<div class="app">
<div class="preview-area" id="previewArea"><canvas id="canvas"></canvas></div>

<div class="control-panel">
<div class="panel-header"><h1>多边形绘制</h1><div class="sub">扫描线光栅化 · Sub-pixel 精确渲染</div></div>
<div class="panel-body">

<div class="cg">
    <div class="title">填充样式 Fill Style</div>
    <div class="color-row"><label>颜色</label><input type="color" id="fillColor" value="#e94560"><span class="hex-val" id="fillHex">#E94560</span></div>
    <div class="slider-row">
        <label>不透明度</label><div class="range-wrap"><input type="range" id="fillAlpha" min="0" max="255" value="220" step="1"><span class="val" id="fillAlphaV">220</span><span class="unit">/255</span></div>
    </div>
</div>

<div class="cg">
    <div class="title">填充规则 Fill Rule</div>
    <div class="toggle-row">
        <label>模式</label><span class="toggle-label" id="ruleLabel1">NonZero</span>
        <div class="toggle-switch" id="ruleToggle"></div>
        <span class="toggle-label" id="ruleLabel2">EvenOdd</span>
    </div>
</div>

<div class="cg">
    <div class="title">混合模式 Blend</div>
    <div class="toggle-row" style="justify-content:space-between">
        <button class="btn btn-pri" id="blendNormal" style="flex:1">Normal</button>
        <button class="btn btn-sec" id="blendAdd" style="flex:1">Add</button>
        <button class="btn btn-sec" id="blendMultiply" style="flex:1">Multiply</button>
    </div>
</div>

<div class="cg">
    <div class="title">顶点列表 Vertices <span style="font-size:10px;color:var(--text-dim)">(<span id="vc">0</span>)</span></div>
    <div class="vertex-list" id="vertexList"></div>
</div>

<div class="cg">
    <div class="title">操作指南</div>
    <div class="help-text">
        <kbd>鼠标左键</kbd> 添加顶点<br>
        <kbd>鼠标右键</kbd> 删除最近顶点<br>
        <kbd>Ctrl+Z</kbd> 撤销<br>
        <kbd>拖拽顶点</kbd> 移动<br>
        <kbd>滚轮</kbd> 缩放画布
    </div>
</div>

<div class="btn-row">
    <button class="btn btn-pri" id="presetTri">三角形</button>
    <button class="btn btn-pri" id="presetRect">矩形</button>
    <button class="btn btn-pri" id="presetStar">五角星</button>
</div>
<div class="btn-row">
    <button class="btn btn-pri" id="presetHex">正六边形</button>
    <button class="btn btn-pri" id="presetSelf">自交星</button>
    <button class="btn btn-pri" id="presetConcave">凹多边形</button>
</div>
<div class="btn-row">
    <button class="btn btn-sec" id="exportBtn">导出坐标</button>
    <button class="btn btn-dan" id="clearBtn">清空</button>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
 * 多边形光栅化工具 —— 模拟 ipgui_draw_polygon 的扫描线渲染
 * 使用 sub-pixel 覆盖率实现抗锯齿 (IPGUI cell-based AA 的 JS 等价实现)
 * ============================================================================ */
const $=id=>document.getElementById(id);

const canvas=$('canvas'),ctx=canvas.getContext('2d');
const fillColor=$('fillColor'),fillHex=$('fillHex'),fillAlpha=$('fillAlpha'),fillAlphaV=$('fillAlphaV');
const ruleToggle=$('ruleToggle'),ruleLabel1=$('ruleLabel1'),ruleLabel2=$('ruleLabel2');
const blendNormal=$('blendNormal'),blendAdd=$('blendAdd'),blendMultiply=$('blendMultiply');
const vertexList=$('vertexList'),vc=$('vc'),toast=$('toast');

/* ---- 状态 ---- */
let vertices=[];
let fillRule='nonzero';
let blendMode='normal';
let canW=640, canH=520;
const SUBP=16;       /* 子像素精度: 1 pixel = 16 sub-pixels */
const SUBP_AREA=SUBP*SUBP; /* 一个像素的总子像素面积 */

/* ---- Canvas resize: 填满预览区 ---- */
function resize(){
    const pa=document.getElementById('previewArea');
    const w=Math.max(400, pa.clientWidth-24);
    const h=Math.max(300, pa.clientHeight-24);
    if(w===canW && h===canH) return;
    canW=w; canH=h;
    canvas.width=canW; canvas.height=canH;
    canvas.style.width=canW+'px'; canvas.style.height=canH+'px';
    rerender();
}
window.addEventListener('resize', resize);

/* ==========================================================================
 * 图像缓冲区 (模拟 ipgui_surf_t RGBA8888)
 * ========================================================================== */
let imgBuf=null;
function initImgBuf(){
    if(canW<=0||canH<=0) return;
    imgBuf=ctx.createImageData(canW,canH);
    const d=imgBuf.data;
    for(let i=0;i<d.length;i+=4){d[i]=255;d[i+1]=255;d[i+2]=255;d[i+3]=255;}
}

/* ---- 混合像素到 imgBuf (alpha blend src over bg) ---- */
function blendPixel(px, py, r, g, b, a){
    if(px<0||px>=canW||py<0||py>=canH||a<=0) return;
    const idx=(py*canW+px)*4;
    const bgR=imgBuf.data[idx], bgG=imgBuf.data[idx+1], bgB=imgBuf.data[idx+2];
    const srcA=Math.min(1, a/255);
    const srcR=r, srcG=g, srcB=b;

    let outR, outG, outB;
    switch(blendMode){
    case'add':
        outR=Math.min(255, srcR*srcA+bgR);
        outG=Math.min(255, srcG*srcA+bgG);
        outB=Math.min(255, srcB*srcA+bgB);
        break;
    case'multiply':
        outR=Math.round(((srcR/255)*(bgR/255)*(1-srcA)+(bgR/255)*srcA)*255);
        outG=Math.round(((srcG/255)*(bgG/255)*(1-srcA)+(bgG/255)*srcA)*255);
        outB=Math.round(((srcB/255)*(bgB/255)*(1-srcA)+(bgB/255)*srcA)*255);
        break;
    default:
        outR=Math.round(srcR*srcA+bgR*(1-srcA));
        outG=Math.round(srcG*srcA+bgG*(1-srcA));
        outB=Math.round(srcB*srcA+bgB*(1-srcA));
        break;
    }
    imgBuf.data[idx]=outR; imgBuf.data[idx+1]=outG;
    imgBuf.data[idx+2]=outB; imgBuf.data[idx+3]=255;
}

/* ============================================================================
 * Sub-Pixel 覆盖抗锯齿光栅化器
 * 完整移植 IPGUI render_line_impl + record_cell + ipgui_polygon_line_ras
 * 原理: 每条边在每个像素上计算精确的子像素面积覆盖率,
 *       所有边的贡献按 x 排序后累积 winding, 反推出每个像素的总覆盖比
 * ============================================================================ */
const SUBP_BITS = 4;                /* 1<<4 = 16 */

/* coverage_scale_down: 将面积缩放为 0-255 的覆盖率 */
function coverageScaleDown(area, fillRule){
    /* >>= SUBP_BITS*2+1-8 = 4*2+1-8 = 1 */
    let v=area>>1;
    if(v<0) v=-v-1;
    if(fillRule!=='nonzero'){
        v&=511;                    /* modulo 512 */
        if(v>=256) v=511-v;        /* triangle wave */
    } else {
        if(v>=256) v=255;          /* NONZERO: clamp */
    }
    return v;
}

function rasterizePolygon(){
    if(vertices.length<3) return;

    const hex=fillColor.value;
    const fr=parseInt(hex.slice(1,3),16);
    const fg=parseInt(hex.slice(3,5),16);
    const fb=parseInt(hex.slice(5,7),16);
    const baseA=parseInt(fillAlpha.value);

    /* 1. 构建边列表 (子像素坐标系，方向: DOWN=内/右, 即 p2.y > p1.y) */
    const n=vertices.length;
    const edges=[];
    for(let i=0;i<n;i++){
        const a=vertices[i], b=vertices[(i+1)%n];
        const y1=a.y*SUBP, y2=b.y*SUBP;
        if(y1===y2) continue;
        const x1=a.x*SUBP, x2=b.x*SUBP;
        if(y1<y2)      edges.push({va:a, vb:b, yS:y1, yE:y2, x1, x2, dy:y2-y1, dx:x2-x1, dir:1});
        else            edges.push({va:b, vb:a, yS:y2, yE:y1, x1:x2, x2:x1, dy:y1-y2, dx:x1-x2, dir:-1});
    }
    if(!edges.length) return;
    edges.sort((a,b)=>a.yS-b.yS);

    /* 2. 扫描范围 */
    let yMin=Math.floor(edges[0].yS/SUBP), yMax=0;
    edges.forEach(e=>{
        yMin=Math.min(yMin, Math.floor(e.yS/SUBP));
        yMax=Math.max(yMax, Math.floor((e.yE-1)/SUBP));
    });
    yMin=Math.max(0,yMin); yMax=Math.min(canH-1,yMax);

    /* 3. 逐像素行扫描 */
    const cells=[];      /* 当前扫描行所有 cell: [{x, wind, area}] */

    for(let py=yMin; py<=yMax; py++){
        cells.length=0;

        /* 3a. 将所有与当前 y 行相交的边渲染为 cells */
        const yTop=py*SUBP, yBot=(py+1)*SUBP;
        for(let k=0;k<edges.length;k++){
            const e=edges[k];
            if(e.yE<=yTop || e.yS>=yBot) continue;

            /* 计算该边在当前扫描行的起始/结束子像素坐标 */
            let segY1=Math.max(e.yS, yTop);
            let segY2=Math.min(e.yE, yBot);
            const segDy=segY2-segY1;

            /* edge 在 segY1 的 x 坐标 (子像素整数) */
             const t1=(segY1-e.va.y*SUBP)/e.dy;
             const t2=(segY2-e.va.y*SUBP)/e.dy;
             const segX1=Math.round(e.va.x*SUBP + t1*e.dx);
             const segX2=Math.round(e.va.x*SUBP + t2*e.dx);

             /* ---- render_line_impl ---- */
             let ix1=Math.floor(segX1/SUBP), ix2=Math.floor(segX2/SUBP);
             let fx1=segX1-ix1*SUBP, fx2=segX2-ix2*SUBP;

            if(ix1===ix2){
                /* 单像素 */
                let h=segDy, left=(fx2+fx1)*h;
                if(e.dir===1){ left=-left; h=-h; }
                cells.push({x:ix1, wind:h, area:left});
            } else {
                const segDx=segX2-segX1;
                const step=segDx>0?1:-1;
                const absDx=Math.abs(segDx);
                let acc=0, cx=ix1, cfx=fx1;

                /* Use integer-like computation with rounding */
                let xIter=Math.abs(ix1-ix2)+1;
                while(xIter--){
                    let h, left;
                    if(step===1){
                        if(cx!==ix2){
                            /* 非最后一像素: 从 cfx 填充到右边界 */
                            h=Math.floor(segDy*(SUBP-cfx)/absDx);
                            left=(cfx+SUBP)*h;
                            acc+=h;
                        } else {
                            h=segDy-acc;
                            left=(cfx+fx2)*h;
                        }
                    } else {
                        if(cx!==ix2){
                            h=Math.floor(segDy*cfx/absDx);
                            left=cfx*h;
                            acc+=h;
                        } else {
                            h=segDy-acc;
                            left=(cfx+fx2)*h;
                        }
                    }
                    if(e.dir===1){ left=-left; h=-h; }
                    cells.push({x:cx, wind:h, area:left});
                    cfx=(step===1)?0:SUBP;
                    cx+=step;
                }
            }
        }

        if(!cells.length) continue;

        /* 3b. 按 x 排序，合并同 x 的 cell */
        cells.sort((a,b)=>a.x-b.x);
        const merged=[];
        for(const c of cells){
            const last=merged.length?merged[merged.length-1]:null;
            if(last&&last.x===c.x){ last.wind+=c.wind; last.area+=c.area; }
            else merged.push({x:c.x, wind:c.wind, area:c.area});
        }

        /* 3c. ipgui_polygon_line_ras: 累积 winding, 反推覆盖率 */
         let windCov=0;  /* wind_coverage = SUM(wind_height) * SUBP * 2 */
         for(let i=0;i<merged.length;i++){
             const cell=merged[i];
             windCov+=cell.wind*(SUBP<<1);

             /* area_coverage = wind_coverage - cell->area */
             const areaCov=windCov-cell.area;

             /* coverage_scale_down(area_coverage, fill_rule) */
             let cov=coverageScaleDown(areaCov, fillRule);
             if(cov>0){
                 const a=Math.floor(cov*baseA/256);
                 if(a>0) blendPixel(cell.x, py, fr, fg, fb, a);
             }

             /* 填充当前 cell 和下一个 cell 之间的空白像素 */
             if(i+1<merged.length && merged[i+1].x>cell.x+1){
                 let gapCov=coverageScaleDown(windCov, fillRule);
                 if(gapCov>0){
                     const a=Math.floor(gapCov*baseA/256);
                     if(a>0){
                         for(let px=cell.x+1; px<merged[i+1].x; px++){
                             blendPixel(px, py, fr, fg, fb, a);
                         }
                     }
                 }
             }
         }
    }
}

/* ---- 绘制顶点标记 (小号 + 抗锯齿) ---- */
function drawVertices(){
    const R=3.5; /* 半径 */
    for(let i=0;i<vertices.length;i++){
        const cx=vertices[i].x, cy=vertices[i].y;
        for(let dy=-Math.ceil(R); dy<=Math.ceil(R); dy++){
            for(let dx=-Math.ceil(R); dx<=Math.ceil(R); dx++){
                const d=Math.sqrt(dx*dx+dy*dy);
                if(d<=R+0.5){
                    /* 距离抗锯齿: 边缘像素 alpha 渐变 */
                    let a=255;
                    if(d>R-1) a=Math.round(255*Math.max(0, R+0.5-d));
                    if(a>0) blendPixel(cx+dx, cy+dy, 0, 0, 0, Math.min(255, a));
                }
            }
        }
    }
}

/* ---- 重新渲染 ---- */
function rerender(){
    initImgBuf();
    rasterizePolygon();
    drawVertices();
    ctx.putImageData(imgBuf,0,0);
}

/* ---- 事件：统一用 mousedown/mouseup/mousemove 避免 click 冲突 ---- */
let dragIdx=-1;
let mousedownX=0, mousedownY=0;
let hasDragged=false;

canvas.addEventListener('mousedown', e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=Math.round(e.clientX-rect.left);
    const my=Math.round(e.clientY-rect.top);
    mousedownX=mx; mousedownY=my; hasDragged=false;

    if(e.button===2) return; /* right-click handled by contextmenu */

    /* 检查是否点到已有顶点 → 开始拖拽 */
    for(let i=0;i<vertices.length;i++){
        const v=vertices[i];
        if(Math.abs(v.x-mx)<8 && Math.abs(v.y-my)<8){
            dragIdx=i; hasDragged=true;
            canvas.style.cursor='grabbing';
            return;
        }
    }
    dragIdx=-1;
});

canvas.addEventListener('mousemove', e=>{
    if(dragIdx<0) return;
    const rect=canvas.getBoundingClientRect();
    vertices[dragIdx].x=Math.round(e.clientX-rect.left);
    vertices[dragIdx].y=Math.round(e.clientY-rect.top);
    rerender(); updateVertexList();
});

canvas.addEventListener('mouseup', e=>{
    if(dragIdx>=0){
        /* 完成拖拽 */
        dragIdx=-1;
        canvas.style.cursor='crosshair';
        return;
    }
    /* 没有拖拽 → 是添加顶点操作 */
    const rect=canvas.getBoundingClientRect();
    const mx=Math.round(e.clientX-rect.left);
    const my=Math.round(e.clientY-rect.top);
    if(Math.abs(mx-mousedownX)<3 && Math.abs(my-mousedownY)<3){
        vertices.push({x:mx, y:my});
        rerender(); updateVertexList();
    }
});

canvas.addEventListener('mouseleave', ()=>{
    if(dragIdx>=0){ dragIdx=-1; canvas.style.cursor='crosshair'; }
});
canvas.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(vertices.length>0){ vertices.pop(); rerender(); updateVertexList(); }
});
document.addEventListener('keydown', e=>{
    if(e.ctrlKey && e.key==='z'){
        e.preventDefault();
        if(vertices.length>0){ vertices.pop(); rerender(); updateVertexList(); }
    }
});

// 混合模式按钮
blendNormal.classList.add('btn-pri');blendNormal.classList.remove('btn-sec');
[blendNormal,blendAdd,blendMultiply].forEach(btn=>{
    btn.addEventListener('click',()=>{
        [blendNormal,blendAdd,blendMultiply].forEach(b=>{b.classList.remove('btn-pri');b.classList.add('btn-sec');});
        btn.classList.add('btn-pri');btn.classList.remove('btn-sec');
        blendMode=btn.dataset.blend||btn.textContent.toLowerCase();
        rerender();
    });
});
blendNormal.dataset.blend='normal';blendAdd.dataset.blend='add';blendMultiply.dataset.blend='multiply';

// 填充规则切换
let ruleEven=false;
function updateRuleUI(){
    if(ruleEven){ruleToggle.classList.add('active');fillRule='evenodd';}
    else{ruleToggle.classList.remove('active');fillRule='nonzero';}
}
ruleToggle.addEventListener('click',()=>{ruleEven=!ruleEven;updateRuleUI();rerender();});

fillColor.addEventListener('input',()=>{fillHex.textContent=fillColor.value.toUpperCase();rerender();});
fillAlpha.addEventListener('input',()=>{fillAlphaV.textContent=fillAlpha.value;rerender();});

// 滑块微调
function injectSteppers(){
    document.querySelectorAll('.range-wrap').forEach(w=>{
        const rng=w.querySelector('input[type=range]');if(!rng)return;
        const s=document.createElement('span');s.className='stepper';
        s.innerHTML='<button data-dir="-1">─</button><button data-dir="1">+</button>';
        w.appendChild(s);
    });
    document.querySelector('.control-panel').addEventListener('click',e=>{
        const btn=e.target.closest('.stepper button');if(!btn)return;
        const dir=parseInt(btn.dataset.dir);
        const rng=btn.closest('.range-wrap').querySelector('input[type="range"]');if(!rng)return;
        const min=parseInt(rng.min),max=parseInt(rng.max);
        let val=parseInt(rng.value)+dir;val=Math.max(min,Math.min(max,val));
        if(val===parseInt(rng.value))return;rng.value=val;
        rng.dispatchEvent(new Event('input',{bubbles:true}));
    });
}

// 顶点列表
function updateVertexList(){
    vc.textContent=vertices.length;
    vertexList.innerHTML=vertices.map((v,i)=>`<div class="v-item" data-idx="${i}" title="点击高亮">${i}: (${v.x}, ${v.y})</div>`).join('');
    vertexList.querySelectorAll('.v-item').forEach(item=>{
        item.addEventListener('click',()=>{
            const idx=parseInt(item.dataset.idx);
            // highlight logic - just re-render
            rerender();
        });
    });
}

// 预设
$('presetTri').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2,r=160;
    vertices=[{x:cx,y:cy-r},{x:cx-r*0.866,y:cy+r*0.5},{x:cx+r*0.866,y:cy+r*0.5}];
    rerender();updateVertexList();
});
$('presetRect').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2,w=240,h=180;
    vertices=[{x:cx-w/2,y:cy-h/2},{x:cx+w/2,y:cy-h/2},{x:cx+w/2,y:cy+h/2},{x:cx-w/2,y:cy+h/2}];
    rerender();updateVertexList();
});
$('presetStar').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2,R=150,r=60;
    const pts=[];
    for(let i=0;i<5;i++){
        const a1=(i*72-90)*Math.PI/180;
        const a2=((i*72+36)-90)*Math.PI/180;
        pts.push({x:cx+R*Math.cos(a1),y:cy+R*Math.sin(a1)});
        pts.push({x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)});
    }
    vertices=pts;
    rerender();updateVertexList();
});
$('presetHex').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2,R=140;
    vertices=[];
    for(let i=0;i<6;i++){
        const a=(i*60-30)*Math.PI/180;
        vertices.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});
    }
    rerender();updateVertexList();
});
$('presetSelf').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2,R=160;
    vertices=[{x:cx,y:cy-R},{x:cx+R*0.7,y:cy+R*0.7},{x:cx-R,y:cy-R*0.4},{x:cx+R,y:cy-R*0.4},{x:cx-R*0.7,y:cy+R*0.7}];
    rerender();updateVertexList();
});
$('presetConcave').addEventListener('click',()=>{
    const cx=canW/2,cy=canH/2;
    vertices=[{x:cx-160,y:cy-120},{x:cx+160,y:cy-120},{x:cx+160,y:cy+120},{x:cx,y:cy},{x:cx-160,y:cy+120}];
    rerender();updateVertexList();
});
$('exportBtn').addEventListener('click',()=>{
    const s=vertices.map(v=>`(${v.x}, ${v.y})`).join(',\n');
    navigator.clipboard.writeText(s).then(()=>showToast('坐标已复制'));
});
$('clearBtn').addEventListener('click',()=>{vertices=[];rerender();updateVertexList();showToast('已清空');});

function showToast(msg){
    toast.textContent=msg;toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),2000);
}

/* ---- 初始化 ---- */
document.addEventListener('DOMContentLoaded', ()=>{
    resize();
    injectSteppers();
    updateRuleUI();
    rerender();
    updateVertexList();
});
</script>
