<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS3 Box-Shadow 可视化工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #1a1a2e; --panel-bg: #16213e; --card-bg: #0f3460;
    --accent: #e94560; --accent-hover: #ff6b81; --text: #e0e0e0;
    --text-dim: #999; --border: #2a2a4a; --slider-track: #333;
    --slider-fill: #e94560; --success: #4caf50; --warning: #ff9800;
    --radius: 8px;
}
html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

.app { display: flex; height: 100vh; max-width: 1600px; margin: 0 auto; }

/* 预览区 */
.preview-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #e8ecf1; position: relative; min-width: 0;
}
.preview-area::before {
    content: ''; position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
}
.preview-box {
    width: 200px; height: 200px; background: #ffffff; border-radius: 16px;
    position: relative;
    transition: box-shadow 0.15s ease, border-radius 0.15s ease, width 0.1s ease, height 0.1s ease;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #bbb; letter-spacing: 1px; user-select: none;
}
.preview-box .label { text-align: center; line-height: 1.6; }
.preview-box .label .icon { font-size: 32px; display: block; margin-bottom: 4px; }

/* 面板 */
.control-panel {
    width: 400px; background: var(--panel-bg); display: flex; flex-direction: column;
    border-left: 1px solid var(--border); overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: var(--slider-track) transparent;
}
.control-panel::-webkit-scrollbar { width: 6px; }
.control-panel::-webkit-scrollbar-thumb { background: var(--slider-track); border-radius: 3px; }
.panel-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel-bg); z-index: 2;
}
.panel-header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
.panel-header .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.panel-body { padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; }

/* 控件组 */
.control-group { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.control-group .group-title {
    font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
.control-group .group-title .enable-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px;
}
.control-group .group-title .enable-badge { background: var(--success); color: #fff; }
.control-group .group-title .enable-badge.off { background: #555; color: #999; }
.control-group.disabled .group-content { opacity: 0.35; pointer-events: none; }
.control-group.disabled .toggle-row   { opacity: 0.5;  } /* dim the toggle too, but keep it clickable */

/* 滑块 */
.slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.slider-row:last-child { margin-bottom: 0; }
.slider-row label { font-size: 12px; color: var(--text); white-space: nowrap; min-width: 68px; }
.slider-row .range-wrap { flex: 1; display: flex; align-items: center; gap: 4px; }
.slider-row .range-wrap .val { font-size: 11px; color: var(--accent); font-weight: 600; min-width: 24px; text-align: right; }
.slider-row .range-wrap .unit { font-size: 10px; color: var(--text-dim); min-width: 12px; }
.slider-row .range-wrap .stepper {
    display: flex; gap: 1px; margin-left: 2px;
}
.slider-row .range-wrap .stepper button {
    width: 18px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: rgba(255,255,255,0.04); color: var(--text);
    font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: monospace; user-select: none;
}
.slider-row .range-wrap .stepper button:hover { background: var(--card-bg); border-color: var(--accent); color: var(--accent); }
.slider-row .range-wrap .stepper button:active { transform: scale(0.9); }

input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 5px;
    background: var(--slider-track); border-radius: 3px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent);
    border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 8px rgba(233,69,96,0.4);
}
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--accent); border-radius: 50%; border: 2px solid #fff; }

/* 颜色 */
.color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.color-row label { font-size: 12px; min-width: 68px; }
.color-row input[type="color"] {
    -webkit-appearance: none; width: 32px; height: 24px; border: 2px solid var(--border);
    border-radius: 4px; cursor: pointer; background: transparent; padding: 1px;
}
.color-row .hex-val { font-size: 12px; color: var(--text); font-family: 'Cascadia Code', monospace; }

/* 开关 */
.toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.toggle-row label { font-size: 12px; }
.toggle-switch {
    position: relative; width: 44px; height: 24px; background: var(--slider-track);
    border-radius: 12px; cursor: pointer; transition: background 0.2s;
}
.toggle-switch.active { background: var(--accent); }
.toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: left 0.2s;
}
.toggle-switch.active::after { left: 22px; }

/* CSS 输出 */
.css-output-wrap {
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; position: relative;
}
.css-output-wrap .css-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.css-output-wrap code {
    display: block; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px;
    color: #7ec699; white-space: pre-wrap; word-break: break-all; line-height: 1.6;
    background: rgba(0,0,0,0.2); padding: 8px 10px; border-radius: 4px; max-height: 90px; overflow-y: auto;
}
.copy-btn {
    position: absolute; top: 8px; right: 12px; background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-size: 10px; cursor: pointer;
}
.copy-btn:hover { background: var(--accent); border-color: var(--accent); }
.copy-btn.copied { background: var(--success); border-color: var(--success); }

/* 预设 */
.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 2px; }
.preset-btn {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 5px;
    padding: 6px; font-size: 11px; color: var(--text); cursor: pointer; text-align: center;
    transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.preset-btn:hover { background: var(--card-bg); border-color: var(--accent); }

/* 按钮 */
.btn-row { display: flex; gap: 6px; }
.btn {
    flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 11px; font-weight: 600; cursor: pointer; text-align: center;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: transparent; color: var(--text); }
.btn-secondary:hover { background: rgba(255,255,255,0.05); }
.btn-danger { background: transparent; color: var(--warning); border-color: var(--warning); }
.btn-danger:hover { background: rgba(255,152,0,0.1); }

/* Toast */
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--success); color: #fff; padding: 8px 20px; border-radius: 5px;
    font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 1000;
}
.toast.show { opacity: 1; }

/* 弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999; }
.modal-overlay.show { display: flex; }
.modal { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; }
.modal h3 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
.modal input[type="text"] {
    width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none;
}
.modal input[type="text"]:focus { border-color: var(--accent); }
.modal .modal-btns { display: flex; gap: 6px; }
.modal .modal-btns .btn { flex: 1; }

.saved-presets-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; max-height: 180px; overflow-y: auto; }
.saved-presets-list .saved-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 4px; font-size: 12px;
}
.saved-item .apply-btn, .saved-item .delete-btn {
    background: var(--card-bg); color: var(--text); border: none; padding: 3px 8px; border-radius: 3px;
    cursor: pointer; font-size: 10px; margin-left: 3px;
}
.saved-item .delete-btn { color: var(--warning); background: transparent; }
.saved-item .apply-btn:hover { background: var(--accent); }

@media (max-width: 860px) {
    .app { flex-direction: column; }
    .preview-area { height: 40vh; }
    .control-panel { width: 100%; flex: 1; }
    .preview-box { width: 120px; height: 120px; }
}
</style>
</head>
<body>

<div class="app">
    <div class="preview-area"><div class="preview-box" id="previewBox"><span class="label"><span class="icon">◻</span>BOX</span></div></div>

    <div class="control-panel">
        <div class="panel-header"><h1>Box-Shadow 工具</h1><div class="sub">CSS3 内外阴影可视化调节</div></div>

        <div class="panel-body">
            <!-- 外阴影 Outset -->
            <div class="control-group" id="outsetGroup">
                <div class="group-title">外阴影 Outset <span class="enable-badge" id="outsetBadge">ON</span></div>
                <div class="toggle-row">
                    <label>启用</label>
                    <div class="toggle-switch active" id="outsetEnable"></div>
                </div>
                <div class="group-content">
                    <div class="slider-row"><label>水平 H</label><div class="range-wrap"><input type="range" id="oh" min="-200" max="200" value="8" step="1"><span class="val" id="ohVal">8</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>垂直 V</label><div class="range-wrap"><input type="range" id="ov" min="-200" max="200" value="8" step="1"><span class="val" id="ovVal">8</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>模糊 Blur</label><div class="range-wrap"><input type="range" id="ob" min="0" max="200" value="16" step="1"><span class="val" id="obVal">16</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>扩散 Spread</label><div class="range-wrap"><input type="range" id="os" min="-100" max="100" value="0" step="1"><span class="val" id="osVal">0</span><span class="unit">px</span></div></div>
                    <div class="color-row"><label>颜色</label><input type="color" id="oc" value="#000000"><span class="hex-val" id="ocHex">#000000</span></div>
                    <div class="slider-row"><label>不透明度</label><div class="range-wrap"><input type="range" id="oo" min="0" max="100" value="30" step="1"><span class="val" id="ooVal">30</span><span class="unit">%</span></div></div>
                </div>
            </div>

            <!-- 内阴影 Inset -->
            <div class="control-group disabled" id="insetGroup">
                <div class="group-title">内阴影 Inset <span class="enable-badge off" id="insetBadge">OFF</span></div>
                <div class="toggle-row">
                    <label>启用</label>
                    <div class="toggle-switch" id="insetEnable"></div>
                </div>
                <div class="group-content">
                    <div class="slider-row"><label>水平 H</label><div class="range-wrap"><input type="range" id="ih" min="-200" max="200" value="0" step="1"><span class="val" id="ihVal">0</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>垂直 V</label><div class="range-wrap"><input type="range" id="iv" min="-200" max="200" value="2" step="1"><span class="val" id="ivVal">2</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>模糊 Blur</label><div class="range-wrap"><input type="range" id="ib" min="0" max="200" value="4" step="1"><span class="val" id="ibVal">4</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>扩散 Spread</label><div class="range-wrap"><input type="range" id="is" min="-100" max="100" value="0" step="1"><span class="val" id="isVal">0</span><span class="unit">px</span></div></div>
                    <div class="color-row"><label>颜色</label><input type="color" id="ic" value="#000000"><span class="hex-val" id="icHex">#000000</span></div>
                    <div class="slider-row"><label>不透明度</label><div class="range-wrap"><input type="range" id="io" min="0" max="100" value="20" step="1"><span class="val" id="ioVal">20</span><span class="unit">%</span></div></div>
                </div>
            </div>

            <!-- 盒子本体 -->
            <div class="control-group">
                <div class="group-title">盒子 Box</div>
                <div class="group-content">
                    <div class="color-row"><label>背景色</label><input type="color" id="boxBg" value="#ffffff"><span class="hex-val" id="boxBgHex">#FFFFFF</span></div>
                    <div class="slider-row"><label>宽度 W</label><div class="range-wrap"><input type="range" id="boxW" min="50" max="600" value="200" step="1"><span class="val" id="boxWVal">200</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>高度 H</label><div class="range-wrap"><input type="range" id="boxH" min="50" max="600" value="200" step="1"><span class="val" id="boxHVal">200</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>圆角 TL</label><div class="range-wrap"><input type="range" id="radiusTL" min="0" max="200" value="16" step="1"><span class="val" id="rTLVal">16</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>圆角 TR</label><div class="range-wrap"><input type="range" id="radiusTR" min="0" max="200" value="16" step="1"><span class="val" id="rTRVal">16</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>圆角 BL</label><div class="range-wrap"><input type="range" id="radiusBL" min="0" max="200" value="16" step="1"><span class="val" id="rBLVal">16</span><span class="unit">px</span></div></div>
                    <div class="slider-row"><label>圆角 BR</label><div class="range-wrap"><input type="range" id="radiusBR" min="0" max="200" value="16" step="1"><span class="val" id="rBRVal">16</span><span class="unit">px</span></div></div>
                </div>
            </div>

            <!-- CSS -->
            <div class="control-group">
                <div class="group-title">CSS 代码</div>
                <div class="group-content">
                    <div class="css-output-wrap">
                        <div class="css-label">box-shadow</div>
                        <code id="cssOutput">8px 8px 16px 0px rgba(0,0,0,0.30);</code>
                        <button class="copy-btn" id="copyBtn">复制</button>
                    </div>
                </div>
            </div>

            <!-- 预设 -->
            <div class="control-group">
                <div class="group-title">预设效果</div>
                <div class="group-content"><div class="preset-grid" id="presetGrid"></div></div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="savePresetBtn">保存预设</button>
                <button class="btn btn-secondary" id="showSavedBtn">我的预设</button>
                <button class="btn btn-danger" id="resetBtn">重置</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="saveModal">
    <div class="modal">
        <h3 id="modalTitle">保存自定义预设</h3>
        <input type="text" id="presetNameInput" placeholder="输入预设名称..." maxlength="30">
        <div class="saved-presets-list" id="savedPresetsList" style="display:none;"></div>
        <div class="modal-btns">
            <button class="btn btn-primary" id="modalConfirmBtn">保存</button>
            <button class="btn btn-secondary" id="modalCancelBtn">取消</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
 * Box-Shadow 可视化工具 — 双阴影独立控制
 * ============================================================ */
const $ = id => document.getElementById(id);

/* ---- 外阴影 DOM ---- */
const outsetGroup  = $('outsetGroup');
const outsetEnable = $('outsetEnable');
const outsetBadge  = $('outsetBadge');
const oh=$('oh'),ov=$('ov'),ob=$('ob'),os=$('os'),oc=$('oc'),oo=$('oo');
const ohVal=$('ohVal'),ovVal=$('ovVal'),obVal=$('obVal'),osVal=$('osVal'),ocHex=$('ocHex'),ooVal=$('ooVal');

/* ---- 内阴影 DOM ---- */
const insetGroup  = $('insetGroup');
const insetEnable = $('insetEnable');
const insetBadge  = $('insetBadge');
const ih=$('ih'),iv=$('iv'),ib=$('ib'),is_=$('is'),ic=$('ic'),io=$('io');
const ihVal=$('ihVal'),ivVal=$('ivVal'),ibVal=$('ibVal'),isVal=$('isVal'),icHex=$('icHex'),ioVal=$('ioVal');

/* ---- 盒子 DOM ---- */
const previewBox=$('previewBox');
const boxBg=$('boxBg'),boxBgHex=$('boxBgHex');
const boxW=$('boxW'),boxH=$('boxH'),radiusTL=$('radiusTL'),radiusTR=$('radiusTR'),radiusBL=$('radiusBL'),radiusBR=$('radiusBR');
const boxWVal=$('boxWVal'),boxHVal=$('boxHVal'),rTLVal=$('rTLVal'),rTRVal=$('rTRVal'),rBLVal=$('rBLVal'),rBRVal=$('rBRVal');

const cssOutput=$('cssOutput'); const copyBtn=$('copyBtn');
const presetGrid=$('presetGrid'); const toast=$('toast');
const saveModal=$('saveModal'); const modalTitle=$('modalTitle');
const presetNameInput=$('presetNameInput');
const modalConfirm=$('modalConfirmBtn'); const modalCancel=$('modalCancelBtn');
const savedPresetsList=$('savedPresetsList');

/* ---- 状态 ---- */
let enOutset = true;
let enInset  = false;
let savedPresets = [];

/* ---- 辅助 ---- */
function hexToRgba(hex, pct) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${(pct/100).toFixed(2)})`;
}

function shadowStr(h,v,b,s,c,o,inset) {
    return `${h}px ${v}px ${b}px ${s}px ${hexToRgba(c,o)}${inset?' inset':''}`;
}

/* ---- 预设库 — 双阴影格式 ---- */
const BUILTIN_PRESETS = [
    { name:'Material 1',   oh:0,ov:1,ob:3,os:1,oc:'#000000',oo:20, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Material 2',   oh:0,ov:3,ob:6,os:2,oc:'#000000',oo:23, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Material 4',   oh:0,ov:6,ob:12,os:4,oc:'#000000',oo:28, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Material 8',   oh:0,ov:12,ob:24,os:8,oc:'#000000',oo:32, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Sharp',        oh:4,ov:4,ob:0,os:0,oc:'#000000',oo:40, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Diffuse',      oh:0,ov:8,ob:30,os:-5,oc:'#000000',oo:25, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Neumorphism',  oh:8,ov:8,ob:16,os:-4,oc:'#a3b1c6',oo:50, ih:-8,iv:-8,ib:16,is:-4,ic:'#ffffff',io:90, enO:true, enI:true },
    { name:'Glow Blue',    oh:0,ov:0,ob:25,os:8,oc:'#4fc3f7',oo:60, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Glow Pink',    oh:0,ov:0,ob:30,os:10,oc:'#e94560',oo:55, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Inner Soft',   oh:0,ov:0,ob:0,os:0,oc:'#000000',oo:0, ih:0,iv:2,ib:6,is:0,ic:'#000000',io:20, enO:false, enI:true },
    { name:'Inner Deep',   oh:0,ov:0,ob:0,os:0,oc:'#000000',oo:0, ih:0,iv:4,ib:12,is:-2,ic:'#000000',io:40, enO:false, enI:true },
    { name:'Both Deep',    oh:0,ov:8,ob:20,os:0,oc:'#000000',oo:25, ih:0,iv:2,ib:8,is:-1,ic:'#000000',io:25, enO:true, enI:true },
    { name:'Bottom Only',  oh:0,ov:10,ob:10,os:-5,oc:'#000000',oo:30, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Top Only',     oh:0,ov:-8,ob:10,os:-3,oc:'#000000',oo:20, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Card Float',   oh:0,ov:15,ob:35,os:0,oc:'#000000',oo:18, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
    { name:'Colored',      oh:0,ov:8,ob:20,os:0,oc:'#e94560',oo:40, ih:0,iv:0,ib:0,is:0,ic:'#000000',io:0, enO:true, enI:false },
];

/* ---- getParams ---- */
function getParams() {
    return {
        oh:parseInt(oh.value),ov:parseInt(ov.value),ob:parseInt(ob.value),os:parseInt(os.value),oc:oc.value,oo:parseInt(oo.value),
        ih:parseInt(ih.value),iv:parseInt(iv.value),ib:parseInt(ib.value),is:parseInt(is_.value),ic:ic.value,io:parseInt(io.value),
        enO:enOutset, enI:enInset,
        bgc:boxBg.value,
        bw:parseInt(boxW.value),bh:parseInt(boxH.value),
        rtl:parseInt(radiusTL.value),rtr:parseInt(radiusTR.value),rbl:parseInt(radiusBL.value),rbr:parseInt(radiusBR.value),
    };
}

/* ---- setParams ---- */
function setParams(p) {
    oh.value=p.oh;ohVal.textContent=p.oh; ov.value=p.ov;ovVal.textContent=p.ov;
    ob.value=p.ob;obVal.textContent=p.ob; os.value=p.os;osVal.textContent=p.os;
    oc.value=p.oc;ocHex.textContent=p.oc.toUpperCase(); oo.value=p.oo;ooVal.textContent=p.oo;

    ih.value=p.ih;ihVal.textContent=p.ih; iv.value=p.iv;ivVal.textContent=p.iv;
    ib.value=p.ib;ibVal.textContent=p.ib; is_.value=p.is;isVal.textContent=p.is;
    ic.value=p.ic;icHex.textContent=p.ic.toUpperCase(); io.value=p.io;ioVal.textContent=p.io;

    if(p.enO!=null){enOutset=!!p.enO;updateEnable(outsetEnable,outsetBadge,outsetGroup,enOutset);}
    if(p.enI!=null){enInset=!!p.enI;updateEnable(insetEnable,insetBadge,insetGroup,enInset);}

    if(p.bgc!=null){boxBg.value=p.bgc;boxBgHex.textContent=p.bgc.toUpperCase();}
    if(p.bw!=null){boxW.value=p.bw;boxWVal.textContent=p.bw;}
    if(p.bh!=null){boxH.value=p.bh;boxHVal.textContent=p.bh;}
    if(p.rtl!=null){radiusTL.value=p.rtl;rTLVal.textContent=p.rtl;}
    if(p.rtr!=null){radiusTR.value=p.rtr;rTRVal.textContent=p.rtr;}
    if(p.rbl!=null){radiusBL.value=p.rbl;rBLVal.textContent=p.rbl;}
    if(p.rbr!=null){radiusBR.value=p.rbr;rBRVal.textContent=p.rbr;}
    updateBox();
    updateShadow();
}

/* ---- 启用/关闭 ---- */
function updateEnable(sw,badge,grp,on) {
    if(on){sw.classList.add('active');badge.textContent='ON';badge.classList.remove('off');grp.classList.remove('disabled');}
    else  {sw.classList.remove('active');badge.textContent='OFF';badge.classList.add('off');grp.classList.add('disabled');}
}

/* ---- buildCssText ---- */
function buildCssText() {
    const p=getParams(), parts=[];
    if(p.enO) parts.push(shadowStr(p.oh,p.ov,p.ob,p.os,p.oc,p.oo,false));
    if(p.enI) parts.push(shadowStr(p.ih,p.iv,p.ib,p.is,p.ic,p.io,true));
    const css = parts.length ? parts.join(',\n') + ';' : 'none;';
    return css;
}

function buildSimpleCss(p) {
    const parts=[];
    if(p.enO) parts.push(shadowStr(p.oh,p.ov,p.ob,p.os,p.oc,p.oo,false));
    if(p.enI) parts.push(shadowStr(p.ih,p.iv,p.ib,p.is,p.ic,p.io,true));
    return parts.length ? parts.join(' , ') : 'none';
}

/* ---- updateBox ---- */
function updateBox() {
    const w=parseInt(boxW.value),h=parseInt(boxH.value);
    const rtl=parseInt(radiusTL.value),rtr=parseInt(radiusTR.value),rbl=parseInt(radiusBL.value),rbr=parseInt(radiusBR.value);
    const maxR=Math.min(w,h)>>1,clamp=r=>Math.max(0,Math.min(r,maxR));
    previewBox.style.width=w+'px'; previewBox.style.height=h+'px';
    previewBox.style.background=boxBg.value;
    previewBox.style.borderRadius=`${clamp(rtl)}px ${clamp(rtr)}px ${clamp(rbr)}px ${clamp(rbl)}px`;
    boxWVal.textContent=w;boxHVal.textContent=h;
    boxBgHex.textContent=boxBg.value.toUpperCase();
    /* 根据背景亮度自动调整标签文字颜色 */
    const hex=boxBg.value.slice(1);
    const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    previewBox.style.color=lum>0.6?'#555':'#ddd';
    rTLVal.textContent=clamp(rtl);rTRVal.textContent=clamp(rtr);rBLVal.textContent=clamp(rbl);rBRVal.textContent=clamp(rbr);
}

function updateShadow() {
    const css=buildCssText();
    previewBox.style.boxShadow=css.replace(';','');
    cssOutput.textContent=css;
}

function updateAll() {
    const p=getParams();
    ohVal.textContent=p.oh;ovVal.textContent=p.ov;obVal.textContent=p.ob;osVal.textContent=p.os;ocHex.textContent=p.oc.toUpperCase();ooVal.textContent=p.oo;
    ihVal.textContent=p.ih;ivVal.textContent=p.iv;ibVal.textContent=p.ib;isVal.textContent=p.is;icHex.textContent=p.ic.toUpperCase();ioVal.textContent=p.io;
    updateBox(); updateShadow();
}

/* ---- Toast ---- */
let toastTimer;
function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2000);}

/* ---- 复制 ---- */
function copyCss(){
    const text=cssOutput.textContent;
    navigator.clipboard.writeText(text).then(()=>{copyBtn.textContent='已复制';copyBtn.classList.add('copied');setTimeout(()=>{copyBtn.textContent='复制';copyBtn.classList.remove('copied')},1500);showToast('CSS 已复制');})
    .catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('CSS 已复制');});
}

/* ---- 预设渲染 ---- */
function renderPresets(){
    const all=[...BUILTIN_PRESETS,...savedPresets.map((p,i)=>({...p,_idx:i,_custom:true}))];
    presetGrid.innerHTML='';
    all.forEach(p=>{
        const btn=document.createElement('button');
        btn.className='preset-btn';btn.textContent=(p._custom?'★ ':'')+p.name;
        btn.title=buildSimpleCss(p);
        btn.addEventListener('click',()=>{
            const cur=getParams();
            setParams({...p,bw:cur.bw,bh:cur.bh,rtl:cur.rtl,rtr:cur.rtr,rbl:cur.rbl,rbr:cur.rbr});
            showToast('已应用: '+p.name);
        });
        presetGrid.appendChild(btn);
    });
}

/* ---- 保存/管理 ---- */
function openSaveModal(){presetNameInput.value='';savedPresetsList.style.display='none';modalTitle.textContent='保存自定义预设';modalConfirm.textContent='保存';saveModal.classList.add('show');}
function openManageModal(){presetNameInput.value='';modalTitle.textContent='我的预设';modalConfirm.textContent='关闭';renderSavedList();savedPresetsList.style.display=savedPresets.length?'flex':'none';saveModal.classList.add('show');}

function renderSavedList(){
    savedPresetsList.innerHTML='';
    if(!savedPresets.length){savedPresetsList.innerHTML='<div style="font-size:12px;color:var(--text-dim);padding:8px;">暂无保存的预设</div>';return;}
    savedPresets.forEach((p,idx)=>{
        const div=document.createElement('div');div.className='saved-item';
        div.innerHTML=`<span>★ ${escapeHtml(p.name)}</span><span style="font-size:10px;color:var(--text-dim);">${buildSimpleCss(p)}</span><span><button class="apply-btn">应用</button><button class="delete-btn">删除</button></span>`;
        div.querySelector('.apply-btn').addEventListener('click',()=>{const cur=getParams();setParams({...p,bw:cur.bw,bh:cur.bh,rtl:cur.rtl,rtr:cur.rtr,rbl:cur.rbl,rbr:cur.rbr});saveModal.classList.remove('show');showToast('已应用: '+p.name);});
        div.querySelector('.delete-btn').addEventListener('click',()=>{savedPresets.splice(idx,1);localStorage.setItem('boxShadowSaved',JSON.stringify(savedPresets));renderPresets();renderSavedList();showToast('已删除');});
        savedPresetsList.appendChild(div);
    });
}
function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
function confirmModal(){
    if(modalConfirm.textContent==='关闭'){saveModal.classList.remove('show');return;}
    const name=presetNameInput.value.trim();if(!name){showToast('请输入名称');return;}
    savedPresets.push({...getParams(),name});
    localStorage.setItem('boxShadowSaved',JSON.stringify(savedPresets));
    renderPresets();saveModal.classList.remove('show');showToast('已保存: '+name);
}

function loadSavedPresets(){try{const r=localStorage.getItem('boxShadowSaved');if(r)savedPresets=JSON.parse(r);}catch(e){savedPresets=[];}}

function resetAll(){
    setParams({
        oh:8,ov:8,ob:16,os:0,oc:'#000000',oo:30, enO:true,
        ih:0,iv:2,ib:4,is:0,ic:'#000000',io:20, enI:false,
        bgc:'#ffffff', bw:200,bh:200,rtl:16,rtr:16,rbl:16,rbr:16
    });
    showToast('已重置');
}

/* ---- 事件 ---- */
[oh,ov,ob,os,oo, ih,iv,ib,is_,io, boxW,boxH,radiusTL,radiusTR,radiusBL,radiusBR].forEach(el=>el.addEventListener('input',updateAll));
oc.addEventListener('input',()=>{ocHex.textContent=oc.value.toUpperCase();updateShadow();});
ic.addEventListener('input',()=>{icHex.textContent=ic.value.toUpperCase();updateShadow();});
boxBg.addEventListener('input',updateAll);

outsetEnable.addEventListener('click',()=>{enOutset=!enOutset;updateEnable(outsetEnable,outsetBadge,outsetGroup,enOutset);updateShadow();});
insetEnable.addEventListener('click',()=>{enInset=!enInset;updateEnable(insetEnable,insetBadge,insetGroup,enInset);updateShadow();});

copyBtn.addEventListener('click',copyCss);
$('resetBtn').addEventListener('click',resetAll);
$('savePresetBtn').addEventListener('click',openSaveModal);
$('showSavedBtn').addEventListener('click',openManageModal);
modalConfirm.addEventListener('click',confirmModal);
modalCancel.addEventListener('click',()=>saveModal.classList.remove('show'));
saveModal.addEventListener('click',e=>{if(e.target===saveModal)saveModal.classList.remove('show');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')saveModal.classList.remove('show');});

/* ---- 微调按钮 ---- */
function injectSteppers() {
    document.querySelectorAll('.range-wrap').forEach(wrap => {
        const rng = wrap.querySelector('input[type="range"]');
        if (!rng) return;
        const stepper = document.createElement('span');
        stepper.className = 'stepper';
        stepper.innerHTML = '<button data-dir="-1">−</button><button data-dir="1">+</button>';
        wrap.appendChild(stepper);
    });
    // event delegation
    document.querySelector('.control-panel').addEventListener('click', e => {
        const btn = e.target.closest('.stepper button');
        if (!btn) return;
        const dir = parseInt(btn.dataset.dir);
        const wrap = btn.closest('.range-wrap');
        const rng = wrap.querySelector('input[type="range"]');
        if (!rng) return;
        const min = parseInt(rng.min), max = parseInt(rng.max);
        let val = parseInt(rng.value) + dir;
        val = Math.max(min, Math.min(max, val));
        if (val === parseInt(rng.value)) return;
        rng.value = val;
        rng.dispatchEvent(new Event('input', { bubbles: true }));
    });
}

/* ---- 初始化 ---- */
injectSteppers();
loadSavedPresets();renderPresets();updateAll();
updateEnable(outsetEnable,outsetBadge,outsetGroup,enOutset);
updateEnable(insetEnable,insetBadge,insetGroup,enInset);
</script>
</body>
</html>
