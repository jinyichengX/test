<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时曲线 Demo - Canvas</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #1a1a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h2 { margin: 0 0 16px 0; font-weight: 400; color: #ccc; }
  .panel {
    background: #16213e;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  canvas { display: block; border-radius: 4px; }
  .controls {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    margin-top: 12px;
  }
  .controls label { font-size: 13px; color: #aaa; }
  .controls input[type="range"] { width: 100px; vertical-align: middle; }
  button {
    padding: 6px 18px; border: none; border-radius: 4px;
    background: #e94560; color: #fff; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #ff6b81; }
  button.pause { background: #0f3460; }
  button.pause:hover { background: #1a508b; }
  .info { font-size: 12px; color: #666; margin-top: 8px; }
  .label { font-size: 13px; color: #aaa; margin: 12px 0 4px 0; }
  .label span { color: #e94560; }
  .label span.green { color: #00BFFF; }
  .compare { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .compare .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<h2>实时曲线 Demo — Polyline vs 逐段画线对比</h2>

<div class="compare">
  <div class="col">
    <div class="label"><span class="green">Polyline 模式</span> — 全部 lineTo 后一次 stroke（浏览器统一光栅化）</div>
    <div class="panel">
      <canvas id="canvasPoly" width="800" height="300"></canvas>
    </div>
  </div>
  <div class="col">
    <div class="label"><span>逐段模式</span> — 每段独立 stroke（模拟 IPGUI drawLine 逐段绘制）</div>
    <div class="panel">
      <canvas id="canvasSeg" width="800" height="300"></canvas>
    </div>
  </div>
</div>

<div class="controls" style="margin-top:16px;">
  <label>频率: <input type="range" id="speed" min="1" max="10" value="3"> <span id="speedVal">30 Hz</span></label>
  <label>噪声: <input type="range" id="noise" min="0" max="50" value="20"> <span id="noiseVal">20</span></label>
  <button id="pauseBtn" class="pause">暂停</button>
</div>
<div class="info">
  共享同一数据缓冲区，差异纯粹来自渲染方式。
</div>

<script>
const canvasPoly = document.getElementById('canvasPoly');
const ctxPoly = canvasPoly.getContext('2d');
const canvasSeg = document.getElementById('canvasSeg');
const ctxSeg = canvasSeg.getContext('2d');

const W = 800, H = 300;
const MARGIN = { top: 20, right: 10, bottom: 25, left: 50 };
const PLOT_W = W - MARGIN.left - MARGIN.right;
const PLOT_H = H - MARGIN.top - MARGIN.bottom;

const MAX_POINTS = 400;
const buffer = [];

let speed = 3, noise = 20, paused = false, t = 0;

document.getElementById('speed').oninput = function() {
  speed = +this.value;
  document.getElementById('speedVal').textContent = (speed * 10) + ' Hz';
};
document.getElementById('noise').oninput = function() {
  noise = +this.value;
  document.getElementById('noiseVal').textContent = noise;
};
document.getElementById('pauseBtn').onclick = function() {
  paused = !paused;
  this.textContent = paused ? '继续' : '暂停';
  this.classList.toggle('pause', paused);
};

function generateData() {
  const base = Math.sin(t * 0.05) * 40 + Math.sin(t * 0.13) * 20 + Math.sin(t * 0.03) * 15;
  const jitter = (Math.random() - 0.5) * noise;
  t += 1;
  return base + jitter;
}

// ===== 通用：网格 ====
function drawGrid(ctx) {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = MARGIN.top + (PLOT_H / 5) * i;
    ctx.beginPath();
    ctx.moveTo(MARGIN.left, y);
    ctx.lineTo(MARGIN.left + PLOT_W, y);
    ctx.stroke();
    ctx.fillStyle = '#666';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(60 - i * 24), MARGIN.left - 6, y + 4);
  }
  ctx.textAlign = 'center';
  for (let i = 0; i <= 4; i++) {
    const x = MARGIN.left + (PLOT_W / 4) * i;
    if (buffer.length > 0) ctx.fillText(Math.round(i * 100), x, H - 4);
  }
}

// ===== 模式1: Polyline — 全部线段一次 stroke ====
function drawCurvePolyline(ctx) {
  if (buffer.length < 2) return;
  ctx.strokeStyle = '#00BFFF';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const xStep = PLOT_W / (MAX_POINTS - 1);
  for (let i = 0; i < buffer.length; i++) {
    const x = MARGIN.left + i * xStep;
    const y = MARGIN.top + PLOT_H / 2 - buffer[i] * (PLOT_H / 120);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// ===== 模式2: 逐段 — 每段独立 beginPath/moveTo/lineTo/stroke ====
function drawCurveSegment(ctx) {
  if (buffer.length < 2) return;
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';   // 模拟 IPGUI_LINE_CAP_ROUND
  const xStep = PLOT_W / (MAX_POINTS - 1);
  for (let i = 1; i < buffer.length; i++) {
    const x0 = MARGIN.left + (i - 1) * xStep;
    const y0 = MARGIN.top + PLOT_H / 2 - buffer[i - 1] * (PLOT_H / 120);
    const x1 = MARGIN.left + i * xStep;
    const y1 = MARGIN.top + PLOT_H / 2 - buffer[i] * (PLOT_H / 120);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
}

// ===== 主循环 ====
function render() {
  if (!paused) {
    for (let i = 0; i < speed; i++) {
      buffer.push(generateData());
      if (buffer.length > MAX_POINTS) buffer.shift();
    }
  }

  // Polyline 画布
  ctxPoly.clearRect(0, 0, W, H);
  ctxPoly.fillStyle = '#0a0a1a';
  ctxPoly.fillRect(MARGIN.left, MARGIN.top, PLOT_W, PLOT_H);
  drawGrid(ctxPoly);
  drawCurvePolyline(ctxPoly);

  // 逐段画布
  ctxSeg.clearRect(0, 0, W, H);
  ctxSeg.fillStyle = '#0a0a1a';
  ctxSeg.fillRect(MARGIN.left, MARGIN.top, PLOT_W, PLOT_H);
  drawGrid(ctxSeg);
  drawCurveSegment(ctxSeg);

  requestAnimationFrame(render);
}

for (let i = 0; i < MAX_POINTS; i++) buffer.push(generateData());
render();
</script>
</body>
</html>
