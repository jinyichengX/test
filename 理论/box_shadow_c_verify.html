<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Shadow — C 逻辑验证</title>
<style>
:root{--bg:#0d1117;--s:#161b22;--b:#30363d;--t:#c9d1d9;--d:#8b949e;--a:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding:32px 24px;max-width:960px;margin:0 auto}
h1{font-size:20px;color:var(--a);margin-bottom:4px}
.sub{font-size:13px;color:var(--d);margin-bottom:24px}
.ctls{display:flex;flex-wrap:wrap;gap:10px 20px;margin-bottom:20px;font-size:12px;color:var(--d)}
.ctls label{display:flex;align-items:center;gap:5px}
.ctls input[type=range]{width:80px;accent-color:var(--a)}
.ctls .v{color:var(--a);min-width:16px}
.ctls input[type=checkbox]{accent-color:var(--a)}
.row{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0}
.cell{flex:1;min-width:280px}
cvs{display:block;margin:6px auto;border:1px solid var(--b);border-radius:6px}
cap{display:block;font-size:11px;color:var(--d);text-align:center;margin:4px 0 12px}
.sep{width:100%;height:20px}
</style>
</head>
<body>

<h1>Box Shadow — C 代码逻辑验证</h1>
<div class="sub">与 ipgui_draw_box_shadow.c 逐行对应。3-pass box blur，全整数滑动窗口，四圆角独立。</div>

<div class="ctls">
  <label>blur_w <input type="range" id="SW" min="0" max="30" value="16"><span class="v" id="swV">16</span></label>
  <label>spread <input type="range" id="SP" min="-6" max="10" value="0"><span class="v" id="spV">0</span></label>
  <label>off_x  <input type="range" id="OX" min="-12" max="12" value="4"><span class="v" id="oxV">4</span></label>
  <label>off_y  <input type="range" id="OY" min="-12" max="12" value="4"><span class="v" id="oyV">4</span></label>
  <label>r_tl   <input type="range" id="RTL" min="0" max="24" value="6"><span class="v" id="rtlV">6</span></label>
  <label>r_tr   <input type="range" id="RTR" min="0" max="24" value="12"><span class="v" id="rtrV">12</span></label>
  <label>r_bl   <input type="range" id="RBL" min="0" max="24" value="8"><span class="v" id="rblV">8</span></label>
  <label>r_br   <input type="range" id="RBR" min="0" max="24" value="4"><span class="v" id="rbrV">4</span></label>
  <label><input type="checkbox" id="SHOWMASK" checked> 显示mask</label>
  <label><input type="checkbox" id="SHOWBOX" checked> 显示控件</label>
</div>

<div class="row">
  <div class="cell">
    <cap>硬边 mask（255=蓝，0=背景）</cap>
    <cvs style="width:100%"><canvas id="cMask" width="400" height="260"></canvas></cvs>
  </div>
  <div class="cell">
    <cap>3-pass box blur 后（≈ 高斯模糊）</cap>
    <cvs style="width:100%"><canvas id="cBlur" width="400" height="260"></canvas></cvs>
  </div>
</div>

<cap>最终阴影效果（棋盘格背景）</cap>
<cvs><canvas id="cFinal" width="800" height="300"></canvas></cvs>

<div id="dbg" style="font-size:10px;color:var(--d);font-family:monospace;margin-top:8px"></div>

<script>
/* ============================================================
 *  以下函数与 ipgui_draw_box_shadow.c 逐行对应：
 *
 *   box_blur_1d_h()  ←  C 第 32-66 行
 *   fill_rounded_mask()  ←  C 第 68-117 行
 *   main pipeline  ←  C 第 150-290 行
 * ============================================================ */

/* 1D box blur — 滑动窗口，整数只有加/减/除，O(1) per pixel
 * 与 C 代码 box_blur_1d_h() 完全一致（左到右方向） */
function boxBlur1D(buf, window) {
  const len = buf.length;
  const half = window >> 1;
  const half2 = window - half - 1;
  const tmp = new Float32Array(len);
  let sum = 0;

  /* === 与 C 第 39-47 行对应：Prime sum at position 0 === */
  for (let i = -half; i <= half2; i++) {
    let idx;
    if (i < 0)       idx = 0;
    else if (i >= len) idx = len - 1;
    else             idx = i;
    sum += buf[idx];
  }

  /* === 与 C 第 49-64 行对应：滑动窗口 === */
  for (let x = 0; x < len; x++) {
    tmp[x] = Math.floor((sum + (window >> 1)) / window);

    const left = x - half;
    sum -= (left < 0) ? buf[0] : buf[left];

    const right = x + half2 + 1;
    sum += (right >= len) ? buf[len - 1] : buf[right];
  }

  for (let i = 0; i < len; i++) buf[i] = tmp[i];
}

/* Fill rounded-rect angle mask — 与 C 第 68-117 行对应 */
function fillRoundedMask(mask, mw, mh, core_l, core_t, core_r, core_b,
                          r_tl, r_tr, r_bl, r_br) {
  for (let y = 0; y < mh; y++) {
    for (let x = 0; x < mw; x++) {
      /* bounding-box reject */
      if (x < core_l || x > core_r || y < core_t || y > core_b) {
        mask[y * mw + x] = 0;
        continue;
      }
      let inside = 1;

      if (r_tl > 0 && x < core_l + r_tl && y < core_t + r_tl) {
        const dx = (core_l + r_tl) - x - 1;
        const dy = (core_t + r_tl) - y - 1;
        if (dx * dx + dy * dy > r_tl * r_tl) inside = 0;
      }
      if (inside && r_tr > 0 && x > core_r - r_tr && y < core_t + r_tr) {
        const dx = x - (core_r - r_tr);
        const dy = (core_t + r_tr) - y - 1;
        if (dx * dx + dy * dy > r_tr * r_tr) inside = 0;
      }
      if (inside && r_bl > 0 && x < core_l + r_bl && y > core_b - r_bl) {
        const dx = (core_l + r_bl) - x - 1;
        const dy = y - (core_b - r_bl);
        if (dx * dx + dy * dy > r_bl * r_bl) inside = 0;
      }
      if (inside && r_br > 0 && x > core_r - r_br && y > core_b - r_br) {
        const dx = x - (core_r - r_br);
        const dy = y - (core_b - r_br);
        if (dx * dx + dy * dy > r_br * r_br) inside = 0;
      }

      mask[y * mw + x] = inside ? 255 : 0;
    }
  }
}

/* 3-pass separable box blur — 与 C 第 256-300 行对应 */
function boxBlur3Pass(mask, mw, mh, blur_w) {
  if (blur_w <= 0) return;

  /* 与 C 第 260-267 行对应 */
  let window = blur_w / 2 >> 0;
  if (window < 3) window = blur_w;
  if (window < 3) window = 3;

  const maxDim = mw > mh ? mw : mh;
  const tmp = new Float32Array(maxDim);
  const col = new Float32Array(mh);
  const out = new Float32Array(mh);

  /* Pass 1: horizontal — 与 C 第 271-277 行对应 */
  for (let y = 0; y < mh; y++) {
    const row = new Float32Array(mw);
    for (let x = 0; x < mw; x++) row[x] = mask[y * mw + x];
    boxBlur1D(row, window);
    for (let x = 0; x < mw; x++) mask[y * mw + x] = row[x];
  }

  /* Pass 2: vertical — 与 C 第 273-289 行对应 */
  for (let x = 0; x < mw; x++) {
    for (let y = 0; y < mh; y++) col[y] = mask[y * mw + x];
    boxBlur1D(col, window);
    for (let y = 0; y < mh; y++) mask[y * mw + x] = col[y];
  }

  /* Pass 3: horizontal — 与 C 第 291-298 行对应 */
  for (let y = 0; y < mh; y++) {
    const row = new Float32Array(mw);
    for (let x = 0; x < mw; x++) row[x] = mask[y * mw + x];
    boxBlur1D(row, window);
    for (let x = 0; x < mw; x++) mask[y * mw + x] = row[x];
  }
}

/* ============================================================
 *  渲染
 * ============================================================ */
const bg0 = 58, bg1 = 72;
function checker(x, y) { return ((x >> 4) + (y >> 4)) & 1 ? bg0 : bg1; }

function renderMask(cv, mask, mw, mh) {
  const ctx = cv.getContext('2d');
  cv.width = cv.width;
  const img = ctx.createImageData(cv.width, cv.height);
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < cv.width; x++) {
      const i = (y * cv.width + x) * 4;
      if (x < mw && y < mh) {
        const v = mask[y * mw + x];
        img.data[i]=v; img.data[i+1]=v>0?166:Math.round(checker(x, y)*(1-v/255));
        img.data[i+2]=v>0?255:Math.round(checker(x, y)*(1-v/255));
        img.data[i+3]=255;
      } else {
        const c = checker(x, y);
        img.data[i]=c; img.data[i+1]=c; img.data[i+2]=c; img.data[i+3]=255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function renderShadow(cv, mask, mw, mh, w0, coreW, coreH, r, hb) {
  const ctx = cv.getContext('2d');
  cv.width = cv.width;
  const img = ctx.createImageData(cv.width, cv.height);
  const showBox = document.getElementById('SHOWBOX').checked;
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < cv.width; x++) {
      const i = (y * cv.width + x) * 4;
      const bg = checker(x, y);
      let a = 0;
      if (x >= 0 && x < mw && y >= 0 && y < mh) {
        a = mask[y * mw + x] / 255 * 0.55;
      }
      // widget body
      const inBox = showBox && x >= hb && x < hb + coreW && y >= hb && y < hb + coreH;
      if (inBox) {
        img.data[i]=88; img.data[i+1]=166; img.data[i+2]=255; img.data[i+3]=255;
      } else if (a > 0.001) {
        img.data[i]=img.data[i+1]=img.data[i+2]=Math.round(bg*(1-a));
        img.data[i+3]=255;
      } else {
        img.data[i]=img.data[i+1]=img.data[i+2]=bg; img.data[i+3]=255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function update() {
  const sw = +document.getElementById('SW').value;
  const sp = +document.getElementById('SP').value;
  const ox = +document.getElementById('OX').value;
  const oy = +document.getElementById('OY').value;
  const rtl = +document.getElementById('RTL').value;
  const rtr = +document.getElementById('RTR').value;
  const rbl = +document.getElementById('RBL').value;
  const rbr = +document.getElementById('RBR').value;
  const showMask = document.getElementById('SHOWMASK').checked;
  const showBox = document.getElementById('SHOWBOX').checked;

  document.getElementById('swV').textContent = sw;
  document.getElementById('spV').textContent = sp;
  document.getElementById('oxV').textContent = ox;
  document.getElementById('oyV').textContent = oy;
  document.getElementById('rtlV').textContent = rtl;
  document.getElementById('rtrV').textContent = rtr;
  document.getElementById('rblV').textContent = rbl;
  document.getElementById('rbrV').textContent = rbr;

  /* 控件几何 */
  const boxX = 60, boxY = 40, boxW = 110, boxH = 80;
  const core_l0 = boxX + ox - sp;
  const core_t0 = boxY + oy - sp;
  const core_r0 = boxX + ox + boxW - 1 + sp;
  const core_b0 = boxY + oy + boxH - 1 + sp;

  const hb = (sw >> 1) + 1;
  const sx = core_l0 - hb;
  const sy = core_t0 - hb;
  const sw2 = core_r0 - core_l0 + 1 + hb * 2;
  const sh2 = core_b0 - core_t0 + 1 + hb * 2;

  const mw = sw2, mh = sh2;
  if (mw <= 0 || mh <= 0) return;

  /* mask buffer */
  const mask = new Float32Array(mw * mh);

  /* core in mask-local coords */
  let cl = core_l0 - sx, ct = core_t0 - sy;
  let cr = core_r0 - sx, cb = core_b0 - sy;

  /* clamp */
  if (cl < 0) cl = 0; if (ct < 0) ct = 0;
  if (cr >= mw) cr = mw - 1; if (cb >= mh) cb = mh - 1;

  /* clamp radii */
  const cw = cr - cl + 1, ch = cb - ct + 1;
  let a = rtl, b = rtr, c = rbl, d = rbr;
  const hcap = (r) => { if(2*r>cw) r=cw>>1; if(2*r>ch) r=ch>>1; return r; };
  a = Math.max(0, hcap(a)); b = Math.max(0, hcap(b));
  c = Math.max(0, hcap(c)); d = Math.max(0, hcap(d));

  /* fill mask */
  fillRoundedMask(mask, mw, mh, cl, ct, cr, cb, a, b, c, d);

  /* snapshot raw */
  const maskRaw = new Float32Array(mask);

  /* 3-pass box blur */
  boxBlur3Pass(mask, mw, mh, sw);

  /* render */
  const cMask = document.getElementById('cMask');
  if (showMask) renderMask(cMask, maskRaw, mw, mh);
  else {
    cMask.width = cMask.width;
    const ctx = cMask.getContext('2d');
    for (let y=0;y<cMask.height;y++)for(let x=0;x<cMask.width;x++){
      ctx.fillStyle=`rgb(${checker(x,y)},${checker(x,y)},${checker(x,y)})`;
      ctx.fillRect(x,y,1,1);
    }
  }

  const cBlur = document.getElementById('cBlur');
  renderMask(cBlur, mask, mw, mh);

  const cFinal = document.getElementById('cFinal');
  renderShadow(cFinal, mask, mw, mh, boxW, boxW, boxH, null, hb);

  /* debug info */
  const p0 = maskRaw[Math.floor(mh/2)*mw + Math.floor(mw/2)];
  const p1 = mask[Math.floor(mh/2)*mw + Math.floor(mw/2)];
  const p2 = mask[Math.floor(mh/2)*mw + Math.floor((cl+cr)/2)];
  const p3 = mask[Math.floor(mh/2)*mw + Math.floor(cl)];
  document.getElementById('dbg').textContent =
    `mask: ${mw}×${mh} | core: ${cl},${ct}→${cr},${cb} | ` +
    `center raw=${p0.toFixed(0)} blurred=${p1.toFixed(0)} | ` +
    `halfway alpha=${p2.toFixed(0)} | edge alpha=${p3.toFixed(0)}`;
}

document.querySelectorAll('input').forEach(e => e.addEventListener('input', update));
update();
</script>
</body>
</html>
